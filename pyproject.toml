[project]
name = "jev-context-filter-harness"
version = "0.1.0"
description = "An LLM agent harness that screens tool output with a hosted classifier before the agent reads it."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["llm-agents", "prompt-injection", "tool-output", "context-management", "agentdojo"]
requires-python = ">=3.12"
dependencies = ["openai>=1.40", "httpx>=0.27", "python-dotenv>=1.0"]

[project.scripts]
s1h = "s1harness.cli:main"
s1h-view = "s1harness.view:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["s1harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
